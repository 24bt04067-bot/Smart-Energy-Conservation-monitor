<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Energy Consumption Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #38bdf8;
    }

    h2 {
      margin-top: 40px;
      color: #eab308;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      max-width: 420px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .value {
      font-size: 2rem;
      color: #22c55e;
    }

    canvas {
      background: #020617;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
    }

    footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <h1>⚡ Smart Energy Monitor</h1>
  <p>ESP32 + Sensors + ThingSpeak</p>

  <!-- LIVE VALUES -->
  <div class="card">
    <h2>Live Readings</h2>
    <p>Voltage: <span id="voltage" class="value">-- V</span></p>
    <p>Current: <span id="current" class="value">-- A</span></p>
    <p>Power: <span id="power" class="value">-- W</span></p>
    <p>Energy: <span id="energy" class="value">-- Wh</span></p>
  </div>

  <!-- CHARTS -->
  <h2>📈 Energy Trends</h2>

  <canvas id="voltageChart"></canvas>
  <canvas id="currentChart"></canvas>
  <canvas id="powerChart"></canvas>

  <footer>
    Live data from ThingSpeak<br>
    Updated every 20 seconds
  </footer>

  <!-- DATA + CHART SCRIPT -->
  <script>
    const CHANNEL_ID = "3211765";
    const READ_API_KEY = "Z8H1ODMMOLJMF6X0";

    const url =
      https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json +
      ?api_key=${READ_API_KEY}&results=20;

    // Charts
    const voltageChart = new Chart(document.getElementById("voltageChart"), {
      type: "line",
      data: { labels: [], datasets: [{ label: "Voltage (V)", data: [], borderColor: "#3b82f6", borderWidth: 2 }] }
    });

    const currentChart = new Chart(document.getElementById("currentChart"), {
      type: "line",
      data: { labels: [], datasets: [{ label: "Current (A)", data: [], borderColor: "#ef4444", borderWidth: 2 }] }
    });

    const powerChart = new Chart(document.getElementById("powerChart"), {
      type: "line",
      data: { labels: [], datasets: [{ label: "Power (W)", data: [], borderColor: "#22c55e", borderWidth: 2 }] }
    });

    function fetchData() {
      fetch(url)
        .then(res => res.json())
        .then(data => {
          const feeds = data.feeds;
          if (!feeds || feeds.length === 0) return;

          const labels = feeds.map(f =>
            new Date(f.created_at).toLocaleTimeString()
          );

          const voltageData = feeds.map(f => Number(f.field1));
          const currentData = feeds.map(f => Number(f.field2));
          const powerData   = feeds.map(f => Number(f.field3));
          const energyData  = feeds.map(f => Number(f.field4));

          // Live values (LATEST)
          document.getElementById("voltage").innerText =
            voltageData.at(-1).toFixed(2) + " V";

          document.getElementById("current").innerText =
            currentData.at(-1).toFixed(3) + " A";

          document.getElementById("power").innerText =
            powerData.at(-1).toFixed(2) + " W";

          document.getElementById("energy").innerText =
            energyData.at(-1).toFixed(3) + " Wh";

          // Update charts
          voltageChart.data.labels = labels;
          voltageChart.data.datasets[0].data = voltageData;
          voltageChart.update();

          currentChart.data.labels = labels;
          currentChart.data.datasets[0].data = currentData;
          currentChart.update();

          powerChart.data.labels = labels;
          powerChart.data.datasets[0].data = powerData;
          powerChart.update();
        })
        .catch(err => console.error("ThingSpeak fetch error:", err));
    }

    // Initial + interval update
    fetchData();
    setInterval(fetchData, 20000); // ThingSpeak-safe
  </script>

</body>
</html>

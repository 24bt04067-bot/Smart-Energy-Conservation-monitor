<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Energy Consumption Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #38bdf8;
      margin-bottom: 5px;
    }

    h2 {
      margin-top: 40px;
      color: #eab308;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      max-width: 800px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .value {
      font-size: 2rem;
      color: #22c55e;
    }

    iframe {
      width: 100%;
      height: 380px;
      border: none;
      border-radius: 10px;
      margin-top: 15px;
      background: #ffffff;
    }

    footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <h1>⚡ Smart Energy Monitor</h1>
  <p>ESP32 + Sensors + ThingSpeak</p>

  <!-- LIVE VALUES (NO WIDGETS) -->
  <div class="card">
    <h2>Live Readings</h2>
    <p>Voltage: <span id="voltage" class="value">-- V</span></p>
    <p>Current: <span id="current" class="value">-- A</span></p>
    <p>Power: <span id="power" class="value">-- W</span></p>
    <p>Energy: <span id="energy" class="value">-- Wh</span></p>
  </div>

  <!-- INDIVIDUAL GRAPHS -->
  <h2>📈 Individual Graphs</h2>

  <div class="card">
    <h3 style="color:#3b82f6;">Voltage vs Time</h3>
    <iframe src="https://thingspeak.com/channels/3211765/charts/1?dynamic=true&results=100&type=line"></iframe>
  </div>

  <div class="card">
    <h3 style="color:#ef4444;">Current vs Time</h3>
    <iframe src="https://thingspeak.com/channels/3211765/charts/2?dynamic=true&results=100&type=line"></iframe>
  </div>

  <div class="card">
    <h3 style="color:#22c55e;">Power vs Time</h3>
    <iframe src="https://thingspeak.com/channels/3211765/charts/3?dynamic=true&results=100&type=line"></iframe>
  </div>

  <div class="card">
    <h3 style="color:#f59e0b;">Energy vs Time</h3>
    <iframe src="https://thingspeak.com/channels/3211765/charts/4?dynamic=true&results=100&type=line"></iframe>
  </div>

  <footer>
    Live data from ThingSpeak<br>
    Updates every 20 seconds
  </footer>

  <!-- FIXED JAVASCRIPT -->
  <script>
    const CHANNEL_ID = "3211765";
    const READ_API_KEY = "Z8H1ODMMOLJMF6X0";

    function updateLiveData() {
      const url =
        https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json +
        ?api_key=${READ_API_KEY}&results=1&_=${Date.now()};

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data.feeds || data.feeds.length === 0) return;

          const f = data.feeds[0];

          document.getElementById("voltage").innerText =
            (f.field1 ? Number(f.field1).toFixed(2) : "--") + " V";

          document.getElementById("current").innerText =
            (f.field2 ? Number(f.field2).toFixed(3) : "--") + " A";

          document.getElementById("power").innerText =
            (f.field3 ? Number(f.field3).toFixed(2) : "--") + " W";

          document.getElementById("energy").innerText =
            (f.field4 ? Number(f.field4).toFixed(3) : "--") + " Wh";
        })
        .catch(err => console.error("ThingSpeak fetch error:", err));
    }

    updateLiveData();
    setInterval(updateLiveData, 20000);
  </script>

</body>
</html>
